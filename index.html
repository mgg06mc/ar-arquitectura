<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyectos en AR</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f4f2; color: #111; }
    main { width: min(520px, 90vw); }
    h1 { font-size: 28px; margin: 0 0 6px; }
    p { color: #666; margin: 0 0 28px; }
    a.proyecto { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px;
      margin-bottom: 12px; background: #fff; border-radius: 14px; color: inherit; text-decoration: none;
      box-shadow: 0 1px 4px rgba(0,0,0,.08); font-size: 18px; }
    a.proyecto span { color: #999; }
    footer { margin-top: 28px; font-size: 13px; color: #999; }
  </style>
</head>
<body>
  <main>
    <h1>Proyectos en AR</h1>
    <p>Fundamentos de la Arquitectura · UPV</p>
    <a class="proyecto" href="./prueba/">Maqueta de prueba <span>→</span></a>
    <footer>Escanea el QR del proyecto con el móvil para verlo en realidad aumentada.</footer>
  </main>
</body>
</html>
