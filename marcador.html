<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador de marcador QR para AR</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 24px;
      background: #f3f3f1; color: #111; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { color: #555; line-height: 1.45; margin: 0 0 16px; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 15px;
      border: 1px solid #bbb; border-radius: 8px; }
    .botones { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
    button { padding: 11px 20px; font-size: 15px; border-radius: 8px; border: 0;
      background: #111; color: #fff; cursor: pointer; }
    button.sec { background: #ddd; color: #111; }
    canvas { width: 100%; max-width: 760px; height: auto; background: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,.12); display: block; }
  </style>
</head>
<body>
<main>
  <h1>Generador de marcador QR + marco</h1>
  <p>Genera la imagen que se escanea (QR) y que a la vez sirve de marcador de seguimiento (marco con detalle).
     Descárgala, compílala en el compilador de MindAR para obtener <code>targets.mind</code>
     y muestra o imprime <strong>exactamente esta misma imagen</strong>.</p>

  <label for="url">URL de la web (GitHub Pages)</label>
  <input id="url" value="https://TU-USUARIO.github.io/ar-arquitectura/">

  <label for="titulo">Texto inferior (nombre del proyecto)</label>
  <input id="titulo" value="PROYECTO · FUNDAMENTOS DE LA ARQUITECTURA · UPV">

  <div class="botones">
    <button id="generar">Generar</button>
    <button id="descargar" class="sec">Descargar marcador.png</button>
  </div>

  <canvas id="lienzo" width="1600" height="1600"></canvas>
</main>

<script>
  const S = 1600;                // lado de la imagen en píxeles
  const QR_LADO = 0.40 * S;      // tamaño del QR
  const MARGEN_QR = 0.06 * S;    // zona blanca alrededor del QR (necesaria para que se lea)
  const BORDE = 0.035 * S;       // borde negro exterior

  // Generador pseudoaleatorio con semilla: el mismo texto produce siempre el mismo marco
  function rng(semilla) {
    let h = 1779033703 ^ semilla.length;
    for (let i = 0; i < semilla.length; i++) {
      h = Math.imul(h ^ semilla.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    let a = h >>> 0;
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function generar() {
    const url = document.getElementById('url').value.trim();
    const titulo = document.getElementById('titulo').value.trim();
    const c = document.getElementById('lienzo');
    const ctx = c.getContext('2d');
    const r = rng(url + '|' + titulo);

    // Fondo blanco
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, S, S);

    // Zona libre central (QR + margen) y banda inferior para el texto
    const libre = QR_LADO + 2 * MARGEN_QR;
    const lx = (S - libre) / 2, ly = (S - libre) / 2;
    const bandaTexto = 0.07 * S;
    const dentroLibre = (x, y, rad) =>
      x + rad > lx && x - rad < lx + libre && y + rad > ly && y - rad < ly + libre;
    const enTexto = (y, rad) => y + rad > S - BORDE - bandaTexto;

    // Marco con detalle: formas de tamaños variados, alto contraste y sin simetrías
    const interior = BORDE + 0.015 * S;
    for (let i = 0; i < 420; i++) {
      const rad = 8 + Math.pow(r(), 2.2) * 70;
      const x = interior + rad + r() * (S - 2 * interior - 2 * rad);
      const y = interior + rad + r() * (S - 2 * interior - 2 * rad);
      if (dentroLibre(x, y, rad + 6) || enTexto(y, rad)) continue;

      const gris = r() < 0.75 ? '#000' : (r() < 0.5 ? '#555' : '#999');
      ctx.fillStyle = gris; ctx.strokeStyle = gris;
      ctx.lineWidth = 3 + r() * 9;
      const tipo = r();
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(r() * Math.PI * 2);
      ctx.beginPath();
      if (tipo < 0.28) {                       // triángulo
        ctx.moveTo(0, -rad); ctx.lineTo(rad * 0.9, rad * 0.7); ctx.lineTo(-rad * 0.8, rad * 0.5);
        ctx.closePath(); r() < 0.7 ? ctx.fill() : ctx.stroke();
      } else if (tipo < 0.5) {                 // círculo o anillo
        ctx.arc(0, 0, rad * 0.8, 0, Math.PI * 2);
        r() < 0.6 ? ctx.fill() : ctx.stroke();
      } else if (tipo < 0.72) {                // rectángulo
        const w = rad * (0.6 + r()), h = rad * (0.3 + r() * 0.8);
        r() < 0.7 ? ctx.fillRect(-w / 2, -h / 2, w, h) : ctx.strokeRect(-w / 2, -h / 2, w, h);
      } else if (tipo < 0.88) {                // forma en L (tipo planta)
        const a = rad, b = rad * 0.4;
        ctx.moveTo(-a / 2, -a / 2); ctx.lineTo(a / 2, -a / 2); ctx.lineTo(a / 2, -a / 2 + b);
        ctx.lineTo(-a / 2 + b, -a / 2 + b); ctx.lineTo(-a / 2 + b, a / 2); ctx.lineTo(-a / 2, a / 2);
        ctx.closePath(); ctx.fill();
      } else {                                 // trazo
        ctx.moveTo(-rad, 0); ctx.lineTo(rad, 0); ctx.stroke();
      }
      ctx.restore();
    }

    // Marca de esquina (rompe la simetría: así el seguimiento sabe dónde está "arriba")
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(BORDE + 0.075 * S, BORDE + 0.075 * S, 0.05 * S, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(BORDE + 0.075 * S, BORDE + 0.075 * S, 0.02 * S, 0, Math.PI * 2);
    ctx.fill();

    // Zona blanca del QR
    ctx.fillStyle = '#fff';
    ctx.fillRect(lx, ly, libre, libre);

    // QR
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    const n = qr.getModuleCount();
    const m = QR_LADO / n;
    const qx = (S - QR_LADO) / 2, qy = (S - QR_LADO) / 2;
    ctx.fillStyle = '#000';
    for (let f = 0; f < n; f++)
      for (let col = 0; col < n; col++)
        if (qr.isDark(f, col))
          ctx.fillRect(Math.floor(qx + col * m), Math.floor(qy + f * m), Math.ceil(m), Math.ceil(m));

    // Texto inferior
    ctx.fillStyle = '#000';
    ctx.font = `600 ${Math.round(0.03 * S)}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(titulo, S / 2, S - BORDE - bandaTexto / 2, S - 2 * BORDE - 40);

    // Borde negro exterior
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, S, BORDE);
    ctx.fillRect(0, S - BORDE, S, BORDE);
    ctx.fillRect(0, 0, BORDE, S);
    ctx.fillRect(S - BORDE, 0, BORDE, S);
  }

  document.getElementById('generar').onclick = generar;
  document.getElementById('descargar').onclick = () => {
    generar();
    const a = document.createElement('a');
    a.href = document.getElementById('lienzo').toDataURL('image/png');
    a.download = 'marcador.png';
    a.click();
  };
  generar();
</script>
</body>
</html>
